services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=postarddb
      - APP_ENV=development
      - APP_URL=http://localhost:8081
      - PORT=8080
    volumes:
      - ./uploads:/var/www/html/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
